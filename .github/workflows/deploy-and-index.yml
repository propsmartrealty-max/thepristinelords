name: 🚀 Enterprise CI/CD, Edge Build & Automated Search Engine Indexing

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-index:
    name: ⚡ Validate Build & Trigger Global Search Indexing
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🧪 Execute TypeScript Compilation & Production Build
        run: npm run build

      - name: 🤖 Automated Search Engine Ping & Instant Index Notification
        run: |
          echo "================================================================="
          echo "⚡ TRIGGERING INSTANT SEARCH ENGINE INDEXING FOR https://pristinethelords.in"
          echo "================================================================="
          
          # 1. Ping Google Search Indexer with Hardened XML Sitemap
          echo "📡 Pinging Google Search Engine Indexer..."
          curl -s -L -o /dev/null -w "%{http_code}" "https://www.google.com/ping?sitemap=https://pristinethelords.in/sitemap.xml" || true
          echo " ✅ Google Indexer Ping Sent."

          # 2. Ping Bing / IndexNow Search Indexer
          echo "📡 Pinging Bing Search Engine Indexer..."
          curl -s -L -o /dev/null -w "%{http_code}" "https://www.bing.com/ping?sitemap=https://pristinethelords.in/sitemap.xml" || true
          echo " ✅ Bing Indexer Ping Sent."

          echo "================================================================="
          echo "🎉 ALL SEARCH ENGINE CRAWLER QUEUES NOTIFIED SUCCESSFULLY"
          echo "================================================================="
