name: 🚀 Enterprise CI/CD, Edge Build & Automated Google/Bing Search Indexing

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-index:
    name: ⚡ Validate Build, Deploy & Trigger Real-Time Search Indexing
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🧪 Execute TypeScript Compilation & Production Build
        run: npm run build

      - name: 📡 Real-Time Global IndexNow Protocol Broadcast
        run: |
          echo "================================================================="
          echo "⚡ TRIGGERING REAL-TIME SEARCH INDEXING FOR https://pristinethelords.in"
          echo "================================================================="
          
          # 1. Run authenticated IndexNow ping suite
          bash scripts/ping-indexers.sh

      - name: 🌐 Pre-Warm Cloudflare Anycast Edge Cache for Googlebot
        run: |
          echo "🔥 Pre-warming Cloudflare Edge Cache for Googlebot fast-path..."
          curl -s "https://pristinethelords.in/api/warm-cache" || true
          echo " ✅ Edge cache pre-warm signal dispatched."
          echo "================================================================="
          echo "🎉 ALL GLOBAL SEARCH INDEXATION WORKFLOWS COMPLETED SUCCESSFULLY"
          echo "================================================================="
